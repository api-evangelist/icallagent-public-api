name: iCallAgent Public API (candidate MCP)
summary: >-
  iCallAgent operates an MCP server, but it is NOT a public agent surface. It exists to
  serve the iCallAgent agent RUNTIME during live calls (knowledge-base search, CRM actions,
  integrations) over SSE at GET /api/mcp/sse and POST /api/mcp/messages/, and requires a
  widget_id plus a runtime-issued `token` secret to open a session (an anonymous tools/list
  returns HTTP 400 "session_id is required"). Its docs state plainly it is "not designed as
  a general-purpose endpoint for third-party MCP clients like Claude Desktop or Cursor", and
  the tool set is per-agent and dynamic. It is therefore not cataloged as a reachable remote
  MCP server. Below is a CANDIDATE tool list derived from the public REST operations, for
  reference only — no such server is published.
